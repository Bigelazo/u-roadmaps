name: Sync academic calendar

on:
  schedule:
    # 10:00 Chile time in April and 11:00 in October (both 14:00 UTC).
    - cron: '0 14 15 4,10 *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm sync:academic-calendar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
