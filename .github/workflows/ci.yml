name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: '0'

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm prisma:generate
      - run: pnpm exec next typegen
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        # The superuser matches .env.example and can create the notifications test database.
        env:
          POSTGRES_USER: roadmap_e2e_user
          POSTGRES_PASSWORD: roadmap_e2e_password
          POSTGRES_DB: roadmap_e2e_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roadmap_e2e_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm prisma:generate
      # Both suites share roadmap_notifications_test_db, so they run one after the other.
      - run: pnpm test:unit
      - run: pnpm test:integration
