services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: roadmap_e2e_user
      POSTGRES_PASSWORD: roadmap_e2e_password
      POSTGRES_DB: roadmap_e2e_db
    ports:
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap_e2e_user -d roadmap_e2e_db"]
      interval: 2s
      timeout: 5s
      retries: 15
