# Fast local feedback; CI (.github/workflows/ci.yml) is the gate.
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    - name: eslint
      glob: '*.{ts,tsx,mts,cts,js,mjs,cjs}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm run typecheck
