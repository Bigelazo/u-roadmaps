default_permissions = "u-roadmaps"

[mcp_servers.next_devtools]
command = "npx"
args = ["-y", "next-devtools-mcp@latest"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest", "--headless"]

[mcp_servers.shadcn]
command = "npx"
args = ["shadcn@latest", "mcp"]

[features]
multi_agent = true
network_proxy = true

[permissions.u-roadmaps]
description = "Edit this workspace, fetch npm packages, and reach the local services required by U-Roadmaps tests."
extends = ":workspace"

[permissions.u-roadmaps.filesystem]
# pnpm downloads the version pinned in package.json to this macOS store.
"~/Library/pnpm/package-manager-store" = "write"

[permissions.u-roadmaps.network]
enabled = true
allow_local_binding = true

[permissions.u-roadmaps.network.domains]
"localhost" = "allow"
"127.0.0.1" = "allow"
"registry.npmjs.org" = "allow"
