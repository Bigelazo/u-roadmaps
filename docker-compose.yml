services:
  db:
    image: postgres:15-alpine
    container_name: roadmap-db
    restart: always
    environment:
      POSTGRES_USER: roadmap_user
      POSTGRES_PASSWORD: roadmap_password
      POSTGRES_DB: roadmap_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap_user -d roadmap_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    container_name: roadmap-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://roadmap_user:roadmap_password@db:5432/roadmap_db
      - NODE_ENV=development
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      - VTI_JWT_SECRET=${VTI_JWT_SECRET:?VTI_JWT_SECRET must be set}
      - NEXT_PUBLIC_VTI_LOGIN_URL=${NEXT_PUBLIC_VTI_LOGIN_URL:?NEXT_PUBLIC_VTI_LOGIN_URL must be set}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "pnpm run prisma:prepare && pnpm run dev"

volumes:
  pgdata:
    name: roadmap-pgdata-v2
